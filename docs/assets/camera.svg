<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Camera illustration</title>
  <desc id="desc">A simplified camera icon with gradient accents and a soft background glow.</desc>
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13213f"/>
      <stop offset="100%" stop-color="#263b6c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ae1ff"/>
      <stop offset="100%" stop-color="#9b8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7ae1ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#7ae1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" rx="48" fill="#08101f"/>
  <ellipse cx="320" cy="210" rx="230" ry="150" fill="url(#glow)"/>
  <rect x="130" y="116" width="380" height="180" rx="24" fill="url(#body)" stroke="#88cfff" stroke-opacity="0.35" stroke-width="4"/>
  <rect x="160" y="92" width="100" height="42" rx="12" fill="#1a2b51"/>
  <circle cx="320" cy="206" r="78" fill="#09121f" stroke="url(#accent)" stroke-width="12"/>
  <circle cx="320" cy="206" r="45" fill="none" stroke="#d8efff" stroke-opacity="0.36" stroke-width="8"/>
  <rect x="455" y="144" width="28" height="22" rx="6" fill="url(#accent)"/>
  <rect x="188" y="144" width="64" height="16" rx="8" fill="#94a8d8" opacity="0.7"/>
  <path d="M170 302h300" stroke="#d8efff" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>
</svg>
